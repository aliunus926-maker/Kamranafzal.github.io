  <!-- SCRIPTS -->

  <script>
    let activeCategory = 'all';
    let searchQuery = '';
    let sortMode = 'default';

    function renderCatalog() {
      const catalogGrid = document.getElementById('catalogGrid');
      const noResultsMsg = document.getElementById('noResultsMsg');

      let filtered = products.filter(p => {
        const matchesCategory = activeCategory === 'all' || p.category === activeCategory;
        const matchesSearch = !searchQuery || 
          p.name.toLowerCase().includes(searchQuery) ||
          p.nameUrdu.toLowerCase().includes(searchQuery) ||
          p.keywords.some(k => k.toLowerCase().includes(searchQuery));
        return matchesCategory && matchesSearch;
      });

      if (sortMode === 'price-asc') {
        filtered.sort((a, b) => a.pricePerKg - b.pricePerKg);
      } else if (sortMode === 'price-desc') {
        filtered.sort((a, b) => b.pricePerKg - a.pricePerKg);
      } else if (sortMode === 'name-asc') {
        filtered.sort((a, b) => a.name.localeCompare(b.name));
      }

      if (filtered.length === 0) {
        catalogGrid.innerHTML = '';
        noResultsMsg.style.display = 'block';
      } else {
        noResultsMsg.style.display = 'none';
        catalogGrid.innerHTML = filtered.map(createProductCardHTML).join('');
      }
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      renderCatalog();
    });

    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeCategory = tab.dataset.category;
        renderCatalog();
      });
    });

    document.getElementById('sortSelect').addEventListener('change', (e) => {
      sortMode = e.target.value;
      renderCatalog();
    });

    renderCatalog();
  </script>
